name: Rebuild Astro Site

on:
  # Daily overnight UK — 03:00 UTC (03:00 GMT / 04:00 BST)
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild-astro]

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Astro dependencies
        run: npm ci
        working-directory: ./public-site

      - name: Write Angular environment files
        env:
          ENVIRONMENT_TS: ${{ secrets.ENVIRONMENT_TS }}
          ENVIRONMENT_PROD_TS: ${{ secrets.ENVIRONMENT_PROD_TS }}
        run: |
          if [ -z "${ENVIRONMENT_TS}" ]; then
            echo "ERROR: GitHub secret ENVIRONMENT_TS is missing or empty."
            echo "Set it to the full contents of src/environments/environment.ts"
            exit 1
          fi
          if [ -z "${ENVIRONMENT_PROD_TS}" ]; then
            echo "ERROR: GitHub secret ENVIRONMENT_PROD_TS is missing or empty."
            echo "Set it to the full contents of src/environments/environment.prod.ts"
            exit 1
          fi
          mkdir -p src/environments
          printf '%s\n' "${ENVIRONMENT_TS}" > src/environments/environment.ts
          printf '%s\n' "${ENVIRONMENT_PROD_TS}" > src/environments/environment.prod.ts
          if ! test -s src/environments/environment.ts; then
            echo "ERROR: src/environments/environment.ts was not created or is empty."
            exit 1
          fi
          if ! test -s src/environments/environment.prod.ts; then
            echo "ERROR: src/environments/environment.prod.ts was not created or is empty."
            exit 1
          fi
          echo "Angular environment files written (existence/size OK; contents not printed)."
          ls -la src/environments/environment.ts src/environments/environment.prod.ts

      - name: Write site contacts JSON
        env:
          SITE_CONTACTS_JSON: ${{ secrets.SITE_CONTACTS_JSON }}
        run: |
          if [ -z "${SITE_CONTACTS_JSON}" ]; then
            echo "ERROR: GitHub secret SITE_CONTACTS_JSON is missing or empty."
            echo "Set it to the full contents of config/site-contacts.json"
            exit 1
          fi
          mkdir -p config
          printf '%s\n' "${SITE_CONTACTS_JSON}" > config/site-contacts.json
          if ! test -s config/site-contacts.json; then
            echo "ERROR: config/site-contacts.json was not created or is empty."
            exit 1
          fi
          if ! node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('config/site-contacts.json','utf8'));"; then
            echo "ERROR: SITE_CONTACTS_JSON is not valid JSON (contents not printed)."
            exit 1
          fi
          echo "config/site-contacts.json written (existence/size/JSON OK; contents not printed)."
          ls -la config/site-contacts.json

      - name: Build all (Angular + Astro)
        run: npm run build:all
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: Validate hosting output before deploy
        run: node scripts/validate-hosting-output.js

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: live

      - name: Record successful SEO rebuild
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/record-seo-rebuild-state.js

      - name: Log deployment
        run: |
          echo "Astro site rebuilt and deployed successfully"
          if [ -n "${{ github.event.client_payload.articleId }}" ]; then
            echo "Triggered by article: ${{ github.event.client_payload.articleId }}"
          fi
